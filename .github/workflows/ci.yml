name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The privacy invariant is checked first and cheaply: if a network call has
  # entered the tree, nothing else about the build matters.
  privacy-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no egress path exists
        run: bash scripts/verify_no_network.sh

  core:
    runs-on: ubuntu-latest
    needs: privacy-invariant
    steps:
      - uses: actions/checkout@v4
      - name: Build and test shared C++ core
        run: make test-core

  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Assemble arm64 release
        run: make build-android CONFIG=Release

  ios:
    runs-on: macos-14
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build SwiftUI app
        run: make build-ios CONFIG=Debug IOS_SDK=iphonesimulator
