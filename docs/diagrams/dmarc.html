<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribatic — DMARC report processing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Operations · Scribatic</p>
    <h1>The verdict arrives in the subject line</h1>

    <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dmarc-title dmarc-desc">
      <title id="dmarc-title">DMARC report processing pipeline</title>
      <desc id="dmarc-desc">Receiving mail providers send one DMARC aggregate report per day to dmarc@scribatic.com. An SES receipt rule stores the raw message in the S3 dmarc/ prefix and then invokes the scribatic-dmarc-reporter Lambda, which reads it back, unzips the XML, evaluates every row, writes normalised JSON to the dmarc-parsed/ prefix, and mails a summary whose subject line states whether the day passed or failed. If the function throws, a CloudWatch errors alarm notifies the same inbox through SNS.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== arrows (drawn before boxes) ===== -->
      <!-- A1 receivers -> SES -->
      <line x1="228" y1="124" x2="276" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 SES -> raw store (s3_action, position 1) -->
      <line x1="336" y1="160" x2="336" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A3 SES -> reporter (lambda_action, position 2) -->
      <line x1="456" y1="124" x2="504" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A4 raw store -> reporter (the function reads the message back) -->
      <path d="M 400,264 V 208 Q 400,200 408,200 H 556 Q 564,200 564,192 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A5 reporter -> parsed archive -->
      <line x1="624" y1="160" x2="624" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A6 reporter -> inbox (the headline path) -->
      <line x1="684" y1="112" x2="732" y2="112" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- A7 reporter -> errors alarm (only when the function throws) -->
      <path d="M 684,136 H 700 Q 708,136 708,144 V 292 Q 708,300 716,300 H 732" fill="none" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- A8 alarm -> same inbox -->
      <line x1="824" y1="264" x2="824" y2="160" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== arrow labels (mask + 8px gap above the stroke) ===== -->
      <rect x="236" y="104" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DAILY</text>

      <rect x="464" y="104" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOKE</text>

      <rect x="348" y="206" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>

      <rect x="464" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET</text>

      <rect x="636" y="206" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUT JSON</text>

      <rect x="690" y="92" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="708" y="101" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

      <rect x="836" y="206" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="215" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALERT</text>

      <!-- ===== nodes ===== -->
      <!-- N1 receiving MTAs (external treatment) -->
      <rect x="48" y="88" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="88" width="180" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="56" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="70" y="103" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MTA</text>
      <text x="138" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiving MTAs</text>
      <text x="138" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google · microsoft · yahoo</text>
      <text x="138" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rua=dmarc@scribatic.com</text>

      <!-- N2 SES receipt rule (processing step) -->
      <rect x="276" y="88" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="276" y="88" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="284" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="298" y="103" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SES</text>
      <text x="366" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SES receipt rule</text>
      <text x="366" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parse-dmarc · MX inbound</text>
      <text x="366" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store, then invoke</text>

      <!-- N4 reporter Lambda (FOCAL) -->
      <rect x="504" y="88" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="88" width="180" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="512" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="526" y="103" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="594" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dmarc-reporter</text>
      <text x="594" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unzip · parse · resolve</text>
      <text x="594" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">python3.12 · no retries</text>

      <!-- N6 inbox (FOCAL — the payoff) -->
      <rect x="732" y="88" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="732" y="88" width="180" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="740" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="754" y="103" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIL</text>
      <text x="822" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inbox</text>
      <text x="822" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">[DMARC ok] · [DMARC FAIL]</text>
      <text x="822" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">filter keeps ok out</text>

      <!-- N3 raw mail buffer (store treatment) -->
      <rect x="276" y="264" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="276" y="264" width="180" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="284" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="298" y="279" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
      <text x="366" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dmarc/</text>
      <text x="366" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raw MIME · zip or gzip</text>
      <text x="366" y="328" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buffer · expires 30 d</text>

      <!-- N5 parsed archive (store treatment) -->
      <rect x="504" y="264" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="264" width="180" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="512" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="526" y="279" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
      <text x="594" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dmarc-parsed/</text>
      <text x="594" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">normalised JSON</text>
      <text x="594" y="328" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">archive · expires 400 d</text>

      <!-- N7 errors alarm (optional / failure path) -->
      <rect x="732" y="264" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="732" y="264" width="180" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="740" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="754" y="279" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
      <text x="822" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Errors alarm</text>
      <text x="822" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CloudWatch → SNS</text>
      <text x="822" y="328" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only if the parse throws</text>

      <!-- ===== editorial callout (bottom-left margin) ===== -->
      <text x="48" y="400" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">kept 400 days — the evidence for leaving p=none</text>
      <path d="M 352,392 Q 424,382 498,346" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="504" cy="342" r="2" fill="#2d3142"/>

      <!-- ===== legend ===== -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="448" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="138" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">receiving MTA</text>

      <rect x="296" y="448" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="314" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SES receipt rule</text>

      <rect x="472" y="448" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="490" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">S3 object store</text>

      <rect x="648" y="448" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="666" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">parse and verdict</text>

      <rect x="824" y="448" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="842" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">failure path</text>
    </svg>
  </div>
</body>
</html>
