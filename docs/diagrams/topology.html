<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribatic — data flow topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Scribatic</p>
    <h1>Audio in, insight out — without leaving the device</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-title topology-desc">
      <title id="topology-title">Scribatic data flow topology</title>
      <desc id="topology-desc">Audio captured by the platform layer is written to a lock-free ring buffer, handed across a thin native bridge into a shared C++17 engine core where whisper.cpp transcribes it, chunks are embedded and stored in a local SQLite-VSS and FTS5 index, and llama.cpp answers from retrieved context; transcript segments and generated summaries flow back to the platform UI. No stage reaches the network.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zone: shared C++ core (painted before arrows and nodes) ===== -->
      <rect x="88" y="216" width="784" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="228" y="220" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="229" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED C++17 ENGINE CORE</text>

      <!-- ===== arrows (drawn before boxes) ===== -->
      <!-- A1 capture -> ring buffer -->
      <line x1="324" y1="92" x2="380" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 ring buffer -> bridge -->
      <line x1="580" y1="92" x2="636" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A3 bridge -> whisper.cpp (long hand-off into the core) -->
      <path d="M 736,128 V 176 Q 736,184 728,184 H 200 Q 192,184 192,192 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A4/A5/A6 inside the core -->
      <line x1="272" y1="284" x2="304" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="464" y1="284" x2="496" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="656" y1="284" x2="688" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A7 llama.cpp -> UI -->
      <path d="M 768,320 V 368 Q 768,376 760,376 H 528 Q 520,376 520,384 V 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A8 whisper.cpp -> UI (live transcript) -->
      <path d="M 192,320 V 368 Q 192,376 200,376 H 432 Q 440,376 440,384 V 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== arrow labels (mask + 8px gap above the stroke) ===== -->
      <rect x="335" y="72" width="34" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="81" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">16 kHz</text>

      <rect x="594" y="72" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="81" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRAIN</text>

      <rect x="426" y="164" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO FRAMES</text>

      <rect x="274" y="356" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIVE SEGMENTS</text>

      <rect x="616" y="356" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUMMARY</text>

      <!-- ===== nodes ===== -->
      <!-- N1 audio capture (input treatment) -->
      <rect x="124" y="56" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="124" y="56" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="132" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="146" y="71" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HW</text>
      <text x="224" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audio capture</text>
      <text x="224" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AVAudioEngine · AAudio</text>
      <text x="224" y="120" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">16 kHz mono f32 · ~5 ms</text>

      <!-- N2 ring buffer (store treatment) -->
      <rect x="380" y="56" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="56" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="388" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="402" y="71" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIFO</text>
      <text x="480" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AudioRingBuffer</text>
      <text x="480" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SPSC · lock-free · 30 s</text>
      <text x="480" y="120" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">preallocated once</text>

      <!-- N3 native bridge (backend treatment) -->
      <rect x="636" y="56" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="636" y="56" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="644" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="658" y="71" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FFI</text>
      <text x="736" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Native bridge</text>
      <text x="736" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Swift-C++ vtable · JNI</text>
      <text x="736" y="120" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">marshalling only</text>

      <!-- N4 whisper.cpp (FOCAL) -->
      <rect x="112" y="248" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="112" y="248" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="120" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="134" y="263" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASR</text>
      <text x="192" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">whisper.cpp</text>
      <text x="192" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">encoder / decoder</text>
      <text x="192" y="312" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TranscriptSegment[]</text>

      <!-- N5 chunk + embed -->
      <rect x="304" y="248" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="248" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="326" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMB</text>
      <text x="384" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chunk + embed</text>
      <text x="384" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">256 tok · 64 stride</text>
      <text x="384" y="312" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">384-d float32</text>

      <!-- N6 local store -->
      <rect x="496" y="248" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="248" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="504" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="518" y="263" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="576" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite-VSS + FTS5</text>
      <text x="576" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vss0 ANN · bm25</text>
      <text x="576" y="312" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rowid → chunks.id</text>

      <!-- N7 llama.cpp (FOCAL) -->
      <rect x="688" y="248" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="248" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="696" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="710" y="263" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="768" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">llama.cpp</text>
      <text x="768" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4096-token context</text>
      <text x="768" y="312" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RRF-fused chunks</text>

      <!-- N8 UI state -->
      <rect x="380" y="412" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="412" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="418" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="402" y="427" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="480" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UI state</text>
      <text x="480" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AsyncStream · StateFlow</text>
      <text x="480" y="476" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main thread: layout only</text>

      <!-- ===== editorial callout (bottom-left margin) ===== -->
      <text x="56" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">every stage runs on the CPU that recorded the audio</text>
      <path d="M 116,438 Q 104,398 136,358" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="140" cy="352" r="2" fill="#2d3142"/>

      <!-- ===== legend ===== -->
      <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="524" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="138" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">capture · input</text>

      <rect x="296" y="524" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="314" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">processing stage</text>

      <rect x="472" y="524" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="490" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">local store</text>

      <rect x="648" y="524" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="666" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">on-device inference</text>

      <rect x="824" y="524" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <text x="842" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">shared core</text>
    </svg>
  </div>
</body>
</html>
