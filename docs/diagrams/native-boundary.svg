      <text x="112" y="475" fill="#2d3142" fill-opacity="0.60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KERNEL·CPU</text>

      <text x="168" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SDOT · FP16 FMLA</text>
      <text x="168" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ARMv8.2-A ISA</text>

      <text x="376" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dlopen · SQLite VFS</text>
      <text x="376" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">extension load</text>

      <text x="584" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mmap(2) · madvise(2)</text>
      <text x="584" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">clean file-backed pages</text>

