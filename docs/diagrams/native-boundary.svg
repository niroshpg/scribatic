<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="native-boundary-title native-boundary-desc">
      <title id="native-boundary-title">Scribatic's managed/native boundary on Android</title>
      <desc id="native-boundary-desc">Kotlin capture, the engine facade and the Compose UI run in the managed ART layer; below a JNI boundary sit four native requirements — the ggml inference backends, the sqlite-vss vector index, the mmap-based model residency wrapper, and AAudio capture — each of which depends on a kernel or CPU facility that the JVM cannot reach. Two of the four are wired today; two are planned.</desc>
      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones (painted first, behind arrows and nodes) ===== -->
      <rect x="56" y="48" width="848" height="136" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="88" y="42" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="51" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MANAGED · ART / JVM · GC-SCHEDULED</text>

      <rect x="56" y="288" width="848" height="152" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="88" y="282" width="252" height="12" rx="2" fill="#f5f5f5"/>
      <text x="214" y="291" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NATIVE · NDK r27 · arm64-v8a · NO GC</text>

      <!-- ===== the boundary — the editorial subject of this diagram ===== -->
      <line x1="40" y1="216" x2="920" y2="216" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="56" y="208" width="180" height="16" rx="2" fill="#f5f5f5"/>
      <text x="146" y="219" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">JNI · ART ↔ NDK ABI</text>

      <!-- ===== arrows (drawn before boxes) ===== -->
      <!-- managed flow: audio in from the right, transcript out to the left -->
      <line x1="656" y1="116" x2="596" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="116" x2="308" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- crossings from TranscriptionEngine (bottom edge x 368-592, attach 424/480/536) -->
      <!-- C1 -> 01 ggml backends (wired, accent) -->
      <path d="M 424,152 V 224 Q 424,232 416,232 H 176 Q 168,232 168,240 V 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- C2 -> 02 sqlite-vss (planned, dashed) -->
      <path d="M 480,152 V 240 Q 480,248 472,248 H 384 Q 376,248 376,256 V 312" fill="none" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <!-- C3 -> 03 ModelResidency (wired) -->
      <path d="M 536,152 V 256 Q 536,264 544,264 H 576 Q 584,264 584,272 V 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C4 AudioRecord -> 04 AAudio (planned, dashed) -->
      <path d="M 768,152 V 240 Q 768,248 776,248 H 784 Q 792,248 792,256 V 312" fill="none" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- native -> system ties -->
      <line x1="168" y1="408" x2="168" y2="460" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="376" y1="408" x2="376" y2="460" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="584" y1="408" x2="584" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="408" x2="792" y2="460" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- ===== arrow labels (mask + 8px gap above the stroke) ===== -->
      <rect x="600" y="96" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="105" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PCM f32</text>

      <rect x="308" y="96" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="105" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEGMENTS</text>

