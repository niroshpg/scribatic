      <!-- M1 Compose + ViewModel -->
      <rect x="80" y="80" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="80" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="88" y="86" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="102" y="95" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="192" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compose + ViewModel</text>
      <text x="192" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StateFlow · main thread</text>
      <text x="192" y="146" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">layout only</text>

      <!-- M2 TranscriptionEngine — the FFI seam -->
      <rect x="368" y="80" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="80" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="376" y="86" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="390" y="95" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FFI</text>
      <text x="480" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TranscriptionEngine</text>
      <text x="480" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">11 × external fun</text>
      <text x="480" y="146" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">opaque jlong handle</text>

      <!-- M3 AudioRecord (input treatment) -->
      <rect x="656" y="80" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="80" width="224" height="72" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="664" y="86" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="678" y="95" fill="#7a8399" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIC</text>
      <text x="768" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AudioRecord</text>
      <text x="768" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ENCODING_PCM_FLOAT</text>
      <text x="768" y="146" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">16 kHz mono · JVM thread</text>

      <!-- ===== native nodes — the four premises ===== -->
      <!-- 01 ggml backends (FOCAL) -->
      <rect x="80" y="312" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="312" width="176" height="96" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="88" y="318" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="102" y="327" fill="#eb6c36" fill-opacity="0.90" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="168" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ggml backends</text>
      <text x="168" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whisper.cpp · llama.cpp</text>
      <text x="168" y="386" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hand-written NEON kernels</text>
      <text x="168" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nativeRunTranscriptionPass</text>

      <!-- 02 sqlite-vss (planned) -->
      <rect x="288" y="312" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="312" width="176" height="96" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="296" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="310" y="327" fill="#2d3142" fill-opacity="0.60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="376" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sqlite-vss + faiss</text>
      <text x="376" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loadable C++ extension</text>
      <text x="376" y="386" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bundled SQLite required</text>
      <text x="376" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nativeIndexNote · search</text>

      <!-- 03 ModelResidency -->
      <rect x="496" y="312" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="312" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="504" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="518" y="327" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="584" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ModelResidency</text>
      <text x="584" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mmap · madvise · 1.2 GB</text>
      <text x="584" y="386" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">raw pointer into ggml</text>
      <text x="584" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nativeWarmUp</text>

      <!-- 04 AAudio (planned) -->
      <rect x="704" y="312" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="312" width="176" height="96" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="712" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="726" y="327" fill="#2d3142" fill-opacity="0.60" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="792" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AAudio / Oboe</text>
      <text x="792" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NDK-only C API</text>
      <text x="792" y="386" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no managed equivalent</text>
      <text x="792" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nativePushAudio</text>

      <!-- ===== system strip ===== -->
      <rect x="56" y="460" width="848" height="68" rx="8" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
