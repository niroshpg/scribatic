# =============================================================================
#  XcodeGen specification — the .xcodeproj is a build artefact, not a source
#  file. Generated by `make setup-ios`.
#
#  Rationale: a checked-in pbxproj is an unmergeable blob. This file is the
#  reviewable, diffable definition of the target, and it is what makes the
#  Swift-C++ interop settings auditable instead of buried in a build-settings
#  pane nobody opens.
# =============================================================================
name: Scribatic
options:
  bundleIdPrefix: com.scribatic
  deploymentTarget:
    iOS: "17.0"          # Swift-C++ Interop and Observation both require 17+
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # --- Swift-C++ Interop ------------------------------------------------
    SWIFT_OBJC_INTEROP_MODE: objcxx
    OTHER_SWIFT_FLAGS: "-cxx-interoperability-mode=default"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/ScribaticCore"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../core/engine/include $(SRCROOT)/../../core/database/include"
    # --- Optimisation -----------------------------------------------------
    GCC_OPTIMIZATION_LEVEL: "3"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ScribaticApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ScribaticCore
        buildPhase: none      # headers are consumed via the module map only
    dependencies:
      - target: ScribaticCoreEngine
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scribatic
        NSMicrophoneUsageDescription: >-
          Scribatic transcribes audio entirely on this device. Recordings and
          transcripts never leave your iPhone.
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "0.1.0"
        # Load-bearing, not cosmetic: with file sharing on, the whole app
        # container is exposed over USB/Finder, which would put recordings and
        # the transcript database on a host machine. Regenerating the plist
        # without this key silently revokes that guarantee.
        UIFileSharingEnabled: false
        # Declares no non-exempt encryption. The app implements no cryptography
        # of its own and makes no network requests at all; the only encryption
        # involved is the OS file protection applied to its container, which is
        # the standard exemption. Without this key App Store Connect blocks every
        # TestFlight build behind a manual compliance answer.
        ITSAppUsesNonExemptEncryption: false
        # No NSAppTransportSecurity keys: the app makes no network requests.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scribatic.app
        SWIFT_OBJC_BRIDGING_HEADER: ""     # none needed — that is the point

  # Unit tests run against the app bundle so they can reach internal types and
  # the imported C++ module without a second copy of the interop settings.
  ScribaticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ScribaticApp
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScribaticApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScribaticApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The test bundle has no checked-in plist; there is nothing in it worth
        # reviewing, unlike the app's.
        GENERATE_INFOPLIST_FILE: YES

  # The shared C++ core, driven by its own CMakeLists via a script phase so the
  # exact same compilation flags are used on both platforms.
  ScribaticCoreEngine:
    type: library.static
    platform: iOS
    sources:
      - path: ../../core/engine/src
      - path: ../../core/engine/include
        buildPhase: headers
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_OPTIMIZATION_LEVEL: "3"
        OTHER_CFLAGS: "-ffast-math -funroll-loops"
        DEFINES_MODULE: YES

schemes:
  ScribaticApp:
    build:
      targets:
        ScribaticApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScribaticTests
