# =============================================================================
#  XcodeGen specification — the .xcodeproj is a build artefact, not a source
#  file. Generated by `make setup-ios`.
#
#  Rationale: a checked-in pbxproj is an unmergeable blob. This file is the
#  reviewable, diffable definition of the target, and it is what makes the
#  Swift-C++ interop settings auditable instead of buried in a build-settings
#  pane nobody opens.
# =============================================================================
name: Scribatic
options:
  bundleIdPrefix: com.scribatic
  deploymentTarget:
    # 26: Apple-hosted Background Assets deliver the models (ADR-011). Before
    # 26 the only Background Assets option was self-hosting, which would need
    # a network path in the app.
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # A default for local builds. fastlane passes a timestamp for every upload;
    # without this, a local build has no CFBundleVersion at all, and the
    # simulator refuses to install the downloader extension.
    CURRENT_PROJECT_VERSION: "1"
    # --- Swift-C++ Interop ------------------------------------------------
    SWIFT_OBJC_INTEROP_MODE: objcxx
    OTHER_SWIFT_FLAGS: "-cxx-interoperability-mode=default"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/ScribaticCore"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../core/engine/include $(SRCROOT)/../../core/database/include"
    # --- Optimisation -----------------------------------------------------
    GCC_OPTIMIZATION_LEVEL: "3"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ScribaticApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ScribaticCore
        buildPhase: none      # headers are consumed via the module map only
    dependencies:
      - target: ScribaticCoreEngine
      # Speaker diarization (ADR-009): sherpa-onnx's C API with ONNX Runtime
      # linked statically inside one dynamic framework. Staged by
      # `make fetch-deps`; embedded and signed with the app.
      - framework: ../../core/engine/vendor-bin/sherpa-onnx/ios/SherpaOnnxC.xcframework
        embed: true
      # Downloads the Apple-hosted model packs (ADR-011).
      - target: ScribaticDownloader
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scribatic
        NSMicrophoneUsageDescription: >-
          Scribatic transcribes audio entirely on this device. Recordings and
          transcripts never leave your iPhone.
        UIBackgroundModes: [audio]
        # The design system's faces (SIL OFL, licences in Resources/Fonts).
        # Resources are copied flat into the bundle, so bare file names.
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        # Required for App Store validation: without a launch screen the bundle
        # is rejected as not supporting iPad multitasking. An empty UILaunchScreen
        # is the iOS 14+ form and gives a plain system-coloured launch — there is
        # no splash artwork to show, and the app is on screen immediately.
        UILaunchScreen: {}
        # Also required by App Store validation. The target is universal, and an
        # iPad build that supports multitasking must declare all four; iPhone
        # omits upside-down, which is the platform convention.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "0.1.0"
        # Must indirect through the build setting, not a literal. XcodeGen writes
        # whatever is here verbatim, so a hardcoded number makes the
        # CURRENT_PROJECT_VERSION that fastlane passes inert — and App Store
        # Connect rejects a second upload carrying a build number it has seen.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Load-bearing, not cosmetic: with file sharing on, the whole app
        # container is exposed over USB/Finder, which would put recordings and
        # the transcript database on a host machine. Regenerating the plist
        # without this key silently revokes that guarantee.
        UIFileSharingEnabled: false
        # Declares no non-exempt encryption. The app implements no cryptography
        # of its own and makes no network requests at all; the only encryption
        # involved is the OS file protection applied to its container, which is
        # the standard exemption. Without this key App Store Connect blocks every
        # TestFlight build behind a manual compliance answer.
        ITSAppUsesNonExemptEncryption: false
        # No NSAppTransportSecurity keys: the app makes no network requests.
        # Apple-hosted Background Assets (ADR-011): Apple serves the model
        # packs and the system downloads them into the shared app group.
        BAAppGroupID: group.com.scribatic.app
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scribatic.app
        CODE_SIGN_ENTITLEMENTS: Resources/Scribatic.entitlements
        # Expanded by XcodeGen from the environment, never written here: the
        # repository is public and a team id identifies the account.
        # `make setup-ios` exports it from the gitignored fastlane/.env, so the
        # generated project can sign for a device and survives regeneration.
        # Unset (CI, a fresh clone) it expands to empty, as before.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        # Device and simulator slices are separate static libraries, so the
        # search path is keyed on the SDK being built. A single path would link
        # the wrong architecture and fail at the very end of a long build.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/vendor-lib/iphoneos"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/vendor-lib/iphonesimulator"
        OTHER_LDFLAGS: "-lwhisper -lggml -lggml-base -lggml-cpu -lggml-blas -framework Accelerate"
        SWIFT_OBJC_BRIDGING_HEADER: ""     # none needed — that is the point
        # App Store validation rejects a build with no 120x120 iPhone icon, and
        # it rejects any icon carrying an alpha channel. The catalog holds one
        # opaque 1024 master and Xcode derives the rest.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The Background Assets downloader extension (ADR-011). ExtensionKit, not
  # an app extension: the system launches it to fetch Apple-hosted packs.
  ScribaticDownloader:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Downloader
    info:
      path: Downloader/Info.plist
      properties:
        CFBundleDisplayName: Scribatic Downloader
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scribatic.app.downloader
        CODE_SIGN_ENTITLEMENTS: Downloader/ScribaticDownloader.entitlements
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        SWIFT_OBJC_INTEROP_MODE: objc
        OTHER_SWIFT_FLAGS: ""
        SKIP_INSTALL: YES

  # Unit tests run against the app bundle so they can reach internal types and
  # the imported C++ module without a second copy of the interop settings.
  ScribaticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ScribaticApp
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScribaticApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScribaticApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The test bundle has no checked-in plist; there is nothing in it worth
        # reviewing, unlike the app's.
        GENERATE_INFOPLIST_FILE: YES

  # The shared C++ core, driven by its own CMakeLists via a script phase so the
  # exact same compilation flags are used on both platforms.
  ScribaticCoreEngine:
    type: library.static
    platform: iOS
    sources:
      - path: ../../core/engine/src
      - path: ../../core/engine/include
        buildPhase: headers
      # SQLite amalgamation, compiled into the core exactly as CMake does for
      # Android and the host. -fno-fast-math overrides the target's
      # -ffast-math, which breaks SQLite's IEEE float handling.
      - path: ../../core/database/vendor/sqlite/sqlite3.c
        compilerFlags: "-DSQLITE_ENABLE_FTS5 -DSQLITE_DQS=0 -DSQLITE_DEFAULT_FOREIGN_KEYS=1 -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_DEPRECATED -fno-fast-math -w"
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_OPTIMIZATION_LEVEL: "3"
        OTHER_CFLAGS: "-ffast-math -funroll-loops"
        DEFINES_MODULE: YES
        # This target compiles the engine sources directly instead of going
        # through core/engine/CMakeLists.txt, so the vendored backend headers
        # have to be named here. Built by `make setup-ios-backends`.
        # $(inherited) is load-bearing: without it this replaces the project
        # level paths rather than adding to them, and the engine can no longer
        # find its own public headers.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../core/engine/vendor/whisper.cpp/include"
          - "$(SRCROOT)/../../core/engine/vendor/whisper.cpp/ggml/include"
          - "$(SRCROOT)/../../core/database/vendor/sqlite"
          - "$(SRCROOT)/../../core/engine/vendor-bin/sherpa-onnx/include"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SCRIBATIC_HAVE_SHERPA=1"

schemes:
  ScribaticApp:
    build:
      targets:
        ScribaticApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScribaticTests
