# End-to-end: record a multi-speaker conversation, identify speakers, name
# one, delete the recording and keep the transcript, then share it.
#
# Runs on a simulator against a DEBUG build started with injected audio —
# see docs/TESTING.md, "End-to-end on simulators and emulators". The app is
# launched by simctl rather than here, because the launch argument that
# injects the conversation has to reach the process verbatim.
appId: com.scribatic.app
---
- extendedWaitUntil:
    visible: "No notes yet|Today"
    timeout: 60000
- takeScreenshot: ios-01-list
# One tap both opens the recorder and starts capture.
- tapOn: "New recording"
- extendedWaitUntil:
    visible: "Stop and save"
    timeout: 20000
# The conversation plays in real time (about 41 s). The canteen line is the
# second to last; the last one is still in the decode window until Stop
# flushes it, so it is checked on the note instead.
- extendedWaitUntil:
    visible: ".*canteen.*"
    timeout: 120000
- extendedWaitUntil:            # a pause: lets the final line finish playing
    visible: "never-shown-marker"
    timeout: 10000
    optional: true
- takeScreenshot: ios-02-recording
- tapOn: "Stop and save"
- extendedWaitUntil:
    visible: "SPEAKERS"
    timeout: 180000
- assertVisible: "Speaker 1"
- assertVisible: "Speaker 2"
- takeScreenshot: ios-03-note
- scrollUntilVisible:
    element: ".*Thursday.*"
- takeScreenshot: ios-03b-note-end
- scrollUntilVisible:
    element: "SPEAKERS"
    direction: UP

# Name a speaker.
- tapOn:
    text: "Speaker 1"
    index: 0
- inputText: "Daniel"
- tapOn: "Save"
- assertVisible: "Daniel"
- takeScreenshot: ios-04-named

# Delete the recording; the transcript and names stay.
- tapOn: "More"
- tapOn: "Delete recording…"
- takeScreenshot: ios-05-confirm-delete
- tapOn: "Delete recording"
- extendedWaitUntil:
    visible: ".*Audio deleted.*"
    timeout: 10000
- assertVisible: "Daniel"
- takeScreenshot: ios-06-recording-deleted
- assertNotVisible: "Play recording"
- scrollUntilVisible:           # the transcript itself is still all there
    element: ".*Thursday.*"
- tapOn: "More"
- assertNotVisible: "Identify speakers again"
- tapOn: "Delete note…"        # opens the menu's last item's dialog…
# …which is dismissed, so this note is kept. iOS 18 shows a Cancel button;
# iOS 26 shows the dialog as a popover with none, dismissed by a tap outside.
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    point: "50%,92%"
- assertNotVisible: "Delete note"

# Share it, without names.
- tapOn: "Share"
- tapOn: "Share without names"
- waitForAnimationToEnd
- takeScreenshot: ios-07-share-sheet
